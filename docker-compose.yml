services:
  postgres:
    image: postgres:16
    container_name: flight-postgres
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB}
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER} -d ${WAREHOUSE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight-etl
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${WAREHOUSE_HOST}
      POSTGRES_PORT: ${WAREHOUSE_PORT}
      POSTGRES_DB: ${WAREHOUSE_DB}
      POSTGRES_USER: ${WAREHOUSE_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD}
    volumes:
      - ./data:/app/data
      - ./code/sql:/app/code/sql
      - ./code/etl:/app/code/etl
    command: python -m code.etl_pipeline

volumes:
  postgres_data:
